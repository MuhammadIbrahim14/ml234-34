# Netlify build & SPA routing for MarketLink (Vite + React)
# https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# SPA fallback — all paths serve index.html so client routing works
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers (safe defaults; does not change UI)
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
