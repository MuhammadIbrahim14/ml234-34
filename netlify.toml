# Netlify build & SPA routing for MarketLink (Vite + React)
# https://docs.netlify.com/configure-builds/file-based-configuration/
#
# IMPORTANT: App lives at the REPO ROOT (not ./client).
# In Netlify UI → Site configuration → Build & deploy → Build settings,
# leave "Base directory" EMPTY. If it is set to "client", deploy fails with:
#   Base directory does not exist: /opt/build/repo/client

[build]
  command = "npm run build"
  publish = "dist"
  # Do not set `base` here — package.json / vite / src are at repo root.

[build.environment]
  NODE_VERSION = "20"

# SPA fallback — all paths serve index.html so client routing works
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers (safe defaults; does not change UI)
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
